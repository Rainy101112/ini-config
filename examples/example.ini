; Example configuration for ini-config.
; Lines starting with ';' or '#' are comments, as are blank lines.
; An inline comment needs whitespace before it: "value ; note".

[server]
host = 127.0.0.1
port = 8080
timeout = 30
greeting = Hello, world ; everything after the semicolon is dropped

[logging]
level = info
file = /var/log/app.log

[logging]   ; a repeated section header merges into the existing section
rotate = daily
