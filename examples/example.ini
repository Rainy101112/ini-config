; Example configuration for ini-config.
; Lines starting with ';' or '#' are comments, as are blank lines.
; An inline comment needs whitespace before it: "value ; note".

; Keys before the first [section] header land in the default section ("").
app_name = ini-config demo
version = 1

[server]
host = 127.0.0.1
port = 8080
timeout = 30
; A quoted value may contain comment markers and inner spaces.
greeting = "Hello, world ; this part is kept"

[logging]
level = info
file = /var/log/app.log

[logging]   ; a repeated section header merges into the existing section
rotate = daily
